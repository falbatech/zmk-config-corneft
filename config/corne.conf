# RGB underglow / per-key (27 LED na stronę: 6 underglow + 21 per-key)
# WS2812 włącza się automatycznie przez devicetree shielda
CONFIG_ZMK_RGB_UNDERGLOW=y

# Wyświetlacz nice!view
CONFIG_ZMK_DISPLAY=y

# BT - moc nadawcza
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Sleep + nazwa klawiatury
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_KEYBOARD_NAME="Corne FT"

# ZMK Studio
CONFIG_ZMK_STUDIO=y

# Pointing (Twój EXTRA layer używa mmv/mkp/msc)
CONFIG_ZMK_POINTING=y

# Eager debouncing (Twoje ustawienie)
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=7

# Auto-off RGB - oszczędza baterię (odkomentuj jeśli chcesz)
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
